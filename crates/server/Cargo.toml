[package]
name = "synctus-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Synctus relay server: routes end-to-end encrypted status between paired devices"

[lib]
name = "synctus_server"
path = "src/lib.rs"

# The daemon. Kept as a separate binary from the management tool so a systemd
# unit points at something that only ever runs the relay.
[[bin]]
name = "synctus-server"
path = "src/bin/daemon.rs"

# The management tool. This is what a user types.
[[bin]]
name = "synctus"
path = "src/bin/synctus.rs"

[dependencies]
synctus-core = { workspace = true, default-features = false }

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["signal", "fs", "io-std"] }
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true

rustls.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
rustls-pki-types.workspace = true

# The WebUI. Pure-std HTTP, so it links fine into the static musl build.
tiny_http = "0.12"
base64.workspace = true

[dev-dependencies]
# The end-to-end test drives real client engines against the real server binary,
# so it needs the client half of `core` too.
synctus-core = { workspace = true, features = ["tls"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
serde_json.workspace = true
