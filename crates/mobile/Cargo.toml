[package]
name = "synctus-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Synctus Android native bridge: runs the sync engine and exposes a JNI surface"

[lib]
name = "synctus"
# `cdylib` for the .so Android loads. `rlib` as well so the platform-independent
# half can be unit-tested on the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
synctus-core = { workspace = true, features = ["tls", "update"] }

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
log = "0.4"
android_logger = "0.15"
tracing-subscriber = { workspace = true }
