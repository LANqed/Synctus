name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings so lint debt cannot accumulate.
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Android version is derived from Cargo.toml at build time, and the release
  # workflow refuses to publish when a tag disagrees with it. This catches the
  # third way they can drift — someone hard-coding a number back into Gradle —
  # in seconds, rather than at release time.
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cargo.toml is the only version source
        run: |
          set -euo pipefail

          cargo_version=$(grep -m1 -A5 '^\[workspace\.package\]' Cargo.toml \
            | grep -m1 '^version' \
            | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Cargo.toml: $cargo_version"
          test -n "$cargo_version"

          # A literal versionName in Gradle would silently override the derived
          # one and ship an APK claiming the wrong version.
          if grep -nE '^\s*versionName\s*=\s*"' android/app/build.gradle.kts; then
            echo "::error::android/app/build.gradle.kts 硬编码了 versionName；它应当从 Cargo.toml 读取"
            exit 1
          fi
          if grep -nE '^\s*versionCode\s*=\s*[0-9]' android/app/build.gradle.kts; then
            echo "::error::android/app/build.gradle.kts 硬编码了 versionCode；它应当从 Cargo.toml 推导"
            exit 1
          fi

  rust:
    name: Rust ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # The desktop client links against GTK (tray), X11 (window, idle) and
      # D-Bus/AppIndicator (notifications, MPRIS).
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-targets

  android-native:
    name: Android native library
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.verify.outputs.built }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # The runner image ships a complete NDK. `nttld/setup-ndk` was tried first
      # but its cache can restore a directory without `toolchains/`, which fails
      # at link time with a missing `clang`; the preinstalled one is always whole.
      # The version is logged so a runner image change is visible rather than
      # silent.
      - name: Locate the NDK
        run: |
          set -e
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          clang="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          test -x "$clang" || { echo "no usable NDK at $ndk"; exit 1; }
          echo "Using NDK $ndk"
          "$clang" --version | head -n1
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Build native library
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t x86_64 \
            -o android/app/src/main/jniLibs \
            build --release -p synctus-mobile

      - name: Verify the libraries exist
        id: verify
        run: |
          set -e
          for abi in arm64-v8a x86_64; do
            path="android/app/src/main/jniLibs/$abi/libsynctus.so"
            test -f "$path" || { echo "missing $path"; exit 1; }
            echo "$path: $(stat -c%s "$path") bytes"
          done
          echo "built=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: android-jnilibs
          path: android/app/src/main/jniLibs/
          retention-days: 7

  android-app:
    name: Android app
    runs-on: ubuntu-latest
    needs: android-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle is installed by the action rather than committed as a wrapper JAR:
      # a binary in the repository is both a review blind spot and a supply-chain
      # risk. The version is pinned here instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fetch the native libraries
        uses: actions/download-artifact@v4
        with:
          name: android-jnilibs
          path: android/app/src/main/jniLibs/

      - name: Unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: synctus-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
