[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/desktop", "crates/mobile"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.76"
license = "MIT"
repository = "https://github.com/LANqed/Synctus"

[workspace.dependencies]
synctus-core = { path = "crates/core", default-features = false }

anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "env-filter",
    "ansi",
] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
hmac = "0.12"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
data-encoding = "2"
base64 = "0.22"
directories = "5"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "tls12",
    "std",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }
webpki-roots = "0.26"
rustls-pemfile = "2"
rustls-pki-types = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

# Status syncing is I/O bound, so the release profile is tuned for a small
# binary instead of the last few percent of throughput.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# `panic = "abort"` is incompatible with `cargo test`, so tests use their own
# profile that keeps unwinding.
[profile.test]
panic = "unwind"

[profile.dev]
panic = "unwind"
